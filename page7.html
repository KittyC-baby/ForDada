<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dada's Little Garden 🌼</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Trebuchet MS", sans-serif;

      color: white;

      background:
        radial-gradient(circle at 20% 20%, #182d24 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, #29331c 0%, transparent 30%),
        linear-gradient(135deg, #030805, #07130d, #0b1006);
    }


    /* =========================
       STARS
    ========================= */

    .stars {
      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 0;
    }

    .star {
      position: absolute;

      color: #fff2a0;

      animation:
        twinkle 2.5s infinite ease-in-out;
    }

    .s1 {
      top: 8%;
      left: 9%;
    }

    .s2 {
      top: 17%;
      left: 27%;
      animation-delay: .5s;
    }

    .s3 {
      top: 10%;
      right: 15%;
      animation-delay: 1s;
    }

    .s4 {
      top: 32%;
      right: 8%;
      animation-delay: .3s;
    }

    .s5 {
      top: 48%;
      left: 6%;
      animation-delay: 1.2s;
    }

    .s6 {
      top: 65%;
      right: 9%;
      animation-delay: .7s;
    }

    .s7 {
      bottom: 15%;
      left: 13%;
      animation-delay: 1.5s;
    }

    .s8 {
      bottom: 8%;
      right: 22%;
      animation-delay: .4s;
    }

    .s9 {
      top: 73%;
      left: 42%;
      animation-delay: 1.1s;
    }

    .s10 {
      top: 24%;
      left: 55%;
      animation-delay: .8s;
    }


    @keyframes twinkle {

      0%, 100% {
        opacity: .25;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
      }

    }


    /* =========================
       PAGE
    ========================= */

    .page {
      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 35px 15px;

      position: relative;

      z-index: 2;
    }


    .container {
      width: 100%;

      max-width: 520px;

      text-align: center;
    }


    /* =========================
       TITLE
    ========================= */

    h1 {
      font-size: 31px;

      color: #ffe36b;

      text-shadow:
        0 0 18px rgba(255, 224, 90, .5);

      margin-bottom: 10px;
    }


    .subtitle {
      color: #d7d9c0;

      font-size: 15px;

      line-height: 1.6;

      margin-bottom: 25px;
    }


    /* =========================
       GARDEN
    ========================= */

    .garden {

      position: relative;

      width: 100%;

      height: 440px;

      overflow: hidden;

      border-radius: 35px;

      border:
        1px solid rgba(255, 226, 100, .13);

      background:
        radial-gradient(
          circle at 50% 65%,
          rgba(116, 143, 46, .18),
          transparent 55%
        );

      box-shadow:
        inset 0 0 50px rgba(0,0,0,.35);
    }


    /* MOON */

    .moon {

      position: absolute;

      top: 25px;

      right: 35px;

      width: 65px;

      height: 65px;

      border-radius: 50%;

      background: #fff1a3;

      box-shadow:
        0 0 35px rgba(255, 235, 145, .5);
    }


    .moon::after {

      content: "";

      position: absolute;

      width: 65px;

      height: 65px;

      border-radius: 50%;

      background: #08110b;

      left: 18px;

      top: -8px;
    }


    /* =========================
       GROUND
    ========================= */

    .ground {

      position: absolute;

      bottom: -60px;

      left: -10%;

      width: 120%;

      height: 170px;

      border-radius: 50% 50% 0 0;

      background:
        radial-gradient(
          ellipse at center,
          #243916,
          #0b180c 70%
        );
    }


    /* =========================
       FLOWERS
    ========================= */

    .flower {

      position: absolute;

      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 45px;

      transition: .35s ease;

      z-index: 5;

      filter:
        drop-shadow(
          0 0 8px rgba(255, 220, 70, .4)
        );
    }


    .flower:hover {

      transform:
        scale(1.2)
        rotate(-5deg);
    }


    .flower:active {

      transform:
        scale(.9);
    }


    .flower1 {
      left: 13%;
      bottom: 70px;
    }

    .flower2 {
      left: 34%;
      bottom: 42px;

      font-size: 52px;
    }

    .flower3 {
      right: 31%;
      bottom: 75px;

      font-size: 43px;
    }

    .flower4 {
      right: 9%;
      bottom: 45px;

      font-size: 50px;
    }


    /* SPECIAL FLOWER */

    .special-flower {

      left: 50%;

      top: 175px;

      transform:
        translateX(-50%);

      font-size: 68px;

      animation:
        gentleGlow 2s infinite ease-in-out;
    }


    .special-flower:hover {

      transform:
        translateX(-50%)
        scale(1.15);
    }


    @keyframes gentleGlow {

      0%, 100% {

        filter:
          drop-shadow(
            0 0 8px #ffd83d
          );

      }

      50% {

        filter:
          drop-shadow(
            0 0 28px #ffe875
          );

      }

    }


    /* =========================
       LITTLE LEAVES
    ========================= */

    .leaf {

      position: absolute;

      font-size: 25px;

      opacity: .75;

      z-index: 4;
    }

    .leaf1 {
      left: 23%;
      bottom: 45px;
      transform: rotate(-25deg);
    }

    .leaf2 {
      right: 22%;
      bottom: 45px;
      transform: rotate(25deg);
    }

    .leaf3 {
      left: 7%;
      bottom: 25px;
    }

    .leaf4 {
      right: 5%;
      bottom: 20px;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      display: none;

      margin-top: 25px;

      padding: 25px 20px;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, .07);

      border:
        1px solid rgba(255, 222, 100, .2);

      backdrop-filter: blur(10px);

      animation:
        messageAppear .8s ease;
    }


    @keyframes messageAppear {

      from {

        opacity: 0;

        transform:
          translateY(20px)
          scale(.95);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    .message p {

      color: #fff3b0;

      font-size: 16px;

      line-height: 1.7;
    }


    .message .big {

      display: block;

      margin-top: 10px;

      color: #ffe05b;

      font-size: 21px;

      font-weight: bold;

      text-shadow:
        0 0 12px rgba(255, 220, 80, .4);
    }


    /* =========================
       NEXT BUTTON
    ========================= */

    .next-btn {

      display: none;

      border: none;

      margin-top: 25px;

      padding: 14px 30px;

      border-radius: 30px;

      background: #ffd84d;

      color: #5b4608;

      font-family: inherit;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(255, 211, 65, .25);

      transition: .3s ease;
    }


    .next-btn:hover {

      transform: scale(1.06);

      background: #ffe88a;
    }


    .hint {

      margin-top: 18px;

      color: #9fa48f;

      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      h1 {
        font-size: 27px;
      }

      .garden {
        height: 420px;
      }

      .flower {
        font-size: 38px;
      }

      .special-flower {
        font-size: 60px;
      }

      .message p {
        font-size: 15px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       STARS
  ========================= -->

  <div class="stars">

    <span class="star s1">✦</span>
    <span class="star s2">✧</span>
    <span class="star s3">✦</span>
    <span class="star s4">·</span>
    <span class="star s5">✧</span>
    <span class="star s6">✦</span>
    <span class="star s7">·</span>
    <span class="star s8">✧</span>
    <span class="star s9">✦</span>
    <span class="star s10">·</span>

  </div>


  <!-- =========================
       PAGE
  ========================= -->

  <main class="page">

    <div class="container">


      <h1>
        Dada's Little Garden 🌼
      </h1>


      <p class="subtitle">
        A tiny garden grown just for you... 💛
      </p>


      <!-- =========================
           GARDEN
      ========================= -->

      <div class="garden">


        <!-- MOON -->

        <div class="moon"></div>


        <!-- GROUND -->

        <div class="ground"></div>


        <!-- FLOWERS -->

        <button
          class="flower flower1"
          onclick="flowerMessage(1)"
        >
          🌼
        </button>


        <button
          class="flower flower2"
          onclick="flowerMessage(2)"
        >
          🌻
        </button>


        <button
          class="flower flower3"
          onclick="flowerMessage(3)"
        >
          🌼
        </button>


        <button
          class="flower flower4"
          onclick="flowerMessage(4)"
        >
          🌻
        </button>


        <!-- SPECIAL FLOWER -->

        <button
          class="flower special-flower"
          onclick="specialFlower()"
        >
          🌼
        </button>


        <!-- LEAVES -->

        <span class="leaf leaf1">
          🌿
        </span>

        <span class="leaf leaf2">
          🌿
        </span>

        <span class="leaf leaf3">
          🍃
        </span>

        <span class="leaf leaf4">
          🍃
        </span>


      </div>


      <!-- =========================
           MESSAGE
      ========================= -->

      <div
        class="message"
        id="message"
      >

        <p id="messageText">
        </p>

      </div>


      <!-- =========================
           NEXT
      ========================= -->

      <button
        class="next-btn"
        id="nextButton"
        onclick="nextPage()"
      >
        Next → 🎁
      </button>


      <p class="hint">
        Tap the flowers... some of them have something to say. 👀🌼
      </p>


    </div>

  </main>


  <script>


    /* =========================
       NORMAL FLOWERS
    ========================= */

    function flowerMessage(number) {

      const message =
        document.getElementById("message");

      const text =
        document.getElementById("messageText");


      let words = "";


      if (number === 1) {

        words =
          "Thank you for always being there for me. 🫶🏻💛";

      }


      if (number === 2) {

        words =
          "Your little baby is always cheering for you! 🐱🎀";

      }


      if (number === 3) {

        words =
          "Don't forget to smile today, Dada! 😆🌼";

      }


      if (number === 4) {

        words =
          "You deserve all the happiness in the whole world. 💛";

      }


      text.innerHTML = words;

      message.style.display = "block";


      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    /* =========================
       SPECIAL FLOWER
    ========================= */

    function specialFlower() {

      const message =
        document.getElementById("message");

      const text =
        document.getElementById("messageText");

      const next =
        document.getElementById("nextButton");


      text.innerHTML =
        "This flower is different... 🌼" +
        "<span class='big'>" +
        "Because it belongs to Dada. 💛" +
        "</span>" +
        "<br>" +
        "Thank you for being my Dada. 🐱🫶🏻";


      message.style.display = "block";


      next.style.display = "inline-block";


      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    /* =========================
       NEXT PAGE
    ========================= */

    function nextPage() {

      window.location.href =
        "page8.html";

    }


  </script>

</body>
          </html>
