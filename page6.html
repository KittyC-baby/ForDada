<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Universe 🌌</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Trebuchet MS", sans-serif;

      color: white;

      background:
        radial-gradient(circle at 20% 20%, #21164b 0%, transparent 25%),
        radial-gradient(circle at 80% 75%, #30163f 0%, transparent 28%),
        linear-gradient(135deg, #03030b, #09051c, #10051a);
    }


    /* =========================
       STARS
    ========================= */

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      color: #fff3a8;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    .s1 {
      top: 7%;
      left: 8%;
    }

    .s2 {
      top: 14%;
      left: 25%;
      animation-delay: .5s;
    }

    .s3 {
      top: 9%;
      right: 12%;
      animation-delay: 1s;
    }

    .s4 {
      top: 30%;
      right: 7%;
      animation-delay: .3s;
    }

    .s5 {
      top: 48%;
      left: 6%;
      animation-delay: 1.2s;
    }

    .s6 {
      top: 62%;
      right: 10%;
      animation-delay: .7s;
    }

    .s7 {
      bottom: 15%;
      left: 12%;
      animation-delay: 1.5s;
    }

    .s8 {
      bottom: 8%;
      right: 20%;
      animation-delay: .4s;
    }

    .s9 {
      top: 72%;
      left: 42%;
      animation-delay: 1.1s;
    }

    .s10 {
      top: 23%;
      left: 55%;
      animation-delay: .8s;
    }

    .s11 {
      bottom: 30%;
      right: 35%;
      animation-delay: 1.4s;
    }

    .s12 {
      bottom: 10%;
      left: 70%;
      animation-delay: .2s;
    }

    @keyframes twinkle {

      0%, 100% {
        opacity: .25;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
      }

    }


    /* =========================
       PAGE
    ========================= */

    .page {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 35px 15px;

      position: relative;
      z-index: 2;
    }

    .container {
      width: 100%;
      max-width: 520px;

      text-align: center;
    }


    /* =========================
       TITLE
    ========================= */

    h1 {
      font-size: 31px;

      color: #ffd85c;

      text-shadow:
        0 0 15px rgba(255, 216, 92, .6);

      margin-bottom: 10px;
    }

    .subtitle {
      color: #d8d2bd;

      font-size: 15px;

      line-height: 1.6;

      margin-bottom: 30px;
    }


    /* =========================
       UNIVERSE
    ========================= */

    .universe {
      position: relative;

      width: 100%;
      height: 410px;

      margin: auto;

      overflow: hidden;

      border-radius: 35px;

      background:
        radial-gradient(
          circle at center,
          rgba(81, 48, 113, .25),
          transparent 60%
        );

      border: 1px solid rgba(255, 226, 120, .12);
    }


    /* =========================
       ORBIT
    ========================= */

    .orbit {
      position: absolute;

      width: 360px;
      height: 360px;

      border: 1px solid rgba(255, 224, 110, .13);

      border-radius: 50%;

      top: 25px;
      left: 50%;

      transform: translateX(-50%);

      animation: orbitSpin 18s linear infinite;
    }

    @keyframes orbitSpin {

      from {
        transform:
          translateX(-50%)
          rotate(0deg);
      }

      to {
        transform:
          translateX(-50%)
          rotate(360deg);
      }

    }


    /* =========================
       PLANETS
    ========================= */

    .planet {
      position: absolute;

      border: none;

      cursor: pointer;

      border-radius: 50%;

      font-family: inherit;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      transition: .4s ease;

      z-index: 5;
    }


    /* DADA PLANET */

    .dada-planet {

      width: 135px;
      height: 135px;

      top: 65px;
      left: 30px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #fff4a4,
          #e8bd36 35%,
          #a97900 75%,
          #644900
        );

      box-shadow:
        0 0 35px rgba(255, 210, 65, .55),
        inset -15px -15px 25px rgba(80, 50, 0, .3);
    }


    /* BABY PLANET */

    .baby-planet {

      width: 155px;
      height: 155px;

      right: 20px;
      bottom: 45px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffeef8,
          #f3a5cf 35%,
          #a85c98 72%,
          #5c275d
        );

      box-shadow:
        0 0 45px rgba(255, 145, 215, .55),
        inset -18px -18px 30px rgba(70, 20, 70, .35);
    }


    .planet:hover {
      transform: scale(1.08);
    }


    .planet-icon {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .planet-name {
      font-size: 15px;

      font-weight: bold;

      color: #fff9cf;

      text-shadow:
        0 2px 8px rgba(0,0,0,.5);
    }

    .planet-hint {
      font-size: 11px;

      margin-top: 5px;

      color: #fff7ce;

      opacity: .8;
    }


    /* =========================
       FLOATING HEARTS
    ========================= */

    .heart {
      position: absolute;

      opacity: 0;

      pointer-events: none;

      font-size: 22px;

      z-index: 10;
    }

    .heart1 {
      left: 55%;
      top: 55%;
    }

    .heart2 {
      left: 45%;
      top: 60%;
    }

    .heart3 {
      left: 60%;
      top: 62%;
    }

    .heart4 {
      left: 50%;
      top: 50%;
    }

    .heart.active {
      animation:
        heartFloat 2s ease forwards;
    }

    @keyframes heartFloat {

      0% {
        opacity: 0;

        transform:
          translate(0, 0)
          scale(.5);
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translate(
            var(--x),
            var(--y)
          )
          scale(1.3);
      }

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 25px;

      padding: 25px 20px;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, .07);

      border:
        1px solid rgba(255, 220, 100, .2);

      backdrop-filter: blur(10px);

      animation:
        messageAppear .8s ease;
    }

    @keyframes messageAppear {

      from {
        opacity: 0;

        transform:
          translateY(20px)
          scale(.95);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .message p {
      font-size: 17px;

      line-height: 1.7;

      color: #fff5ca;
    }

    .message .big {
      display: block;

      color: #ffd85c;

      font-size: 23px;

      font-weight: bold;

      margin-top: 12px;

      text-shadow:
        0 0 12px rgba(255, 216, 92, .5);
    }


    /* =========================
       BABY PHOTO
    ========================= */

    .baby-photo {
      display: none;

      width: 155px;
      height: 155px;

      object-fit: cover;

      border-radius: 50%;

      margin: 25px auto 0;

      border: 4px solid #ffd85c;

      box-shadow:
        0 0 30px rgba(255, 215, 80, .5);

      animation:
        photoAppear 1.2s ease;
    }

    @keyframes photoAppear {

      from {

        opacity: 0;

        transform:
          scale(.5)
          rotate(-8deg);

      }

      to {

        opacity: 1;

        transform:
          scale(1)
          rotate(0);

      }

    }


    /* =========================
       NEXT BUTTON
    ========================= */

    .next-btn {
      display: none;

      border: none;

      margin-top: 28px;

      padding: 14px 30px;

      border-radius: 30px;

      background: #ffd84d;

      color: #5d4708;

      font-family: inherit;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(255, 211, 65, .25);

      transition: .3s ease;
    }

    .next-btn:hover {
      transform: scale(1.06);

      background: #ffe78b;
    }


    .bottom-text {
      margin-top: 25px;

      color: #8e88a0;

      font-size: 13px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      h1 {
        font-size: 27px;
      }

      .universe {
        height: 390px;
      }

      .orbit {
        width: 320px;
        height: 320px;
      }

      .dada-planet {

        width: 120px;
        height: 120px;

        left: 18px;
        top: 55px;
      }

      .baby-planet {

        width: 140px;
        height: 140px;

        right: 12px;
        bottom: 35px;
      }

      .planet-icon {
        font-size: 27px;
      }

      .planet-name {
        font-size: 14px;
      }

      .message p {
        font-size: 15px;
      }

    }

  </style>
</head>


<body>


  <!-- STARS -->

  <div class="stars">

    <span class="star s1">✦</span>
    <span class="star s2">✧</span>
    <span class="star s3">✦</span>
    <span class="star s4">·</span>
    <span class="star s5">✧</span>
    <span class="star s6">✦</span>
    <span class="star s7">·</span>
    <span class="star s8">✧</span>
    <span class="star s9">✦</span>
    <span class="star s10">·</span>
    <span class="star s11">✧</span>
    <span class="star s12">✦</span>

  </div>


  <!-- PAGE -->

  <main class="page">

    <div class="container">


      <h1>
        Our Little Universe 🌌
      </h1>


      <p class="subtitle">
        Two little planets floating in the same universe... 💛
      </p>


      <!-- UNIVERSE -->

      <div class="universe">


        <div class="orbit"></div>


        <!-- DADA PLANET -->

        <button
          class="planet dada-planet"
          onclick="touchDada()"
        >

          <span class="planet-icon">
            🌼
          </span>

          <span class="planet-name">
            Dada's Planet
          </span>

          <span class="planet-hint">
            touch me ✨
          </span>

        </button>


        <!-- BABY PLANET -->

        <button
          class="planet baby-planet"
          onclick="touchBaby()"
        >

          <span class="planet-icon">
            🐱
          </span>

          <span class="planet-name">
            Baby's Planet
          </span>

          <span class="planet-hint">
            touch me 👀
          </span>

        </button>


        <!-- FLOATING HEARTS -->

        <span
          class="heart heart1"
          style="--x:-70px; --y:-100px;"
        >
          💗
        </span>

        <span
          class="heart heart2"
          style="--x:60px; --y:-120px;"
        >
          ✨
        </span>

        <span
          class="heart heart3"
          style="--x:90px; --y:-50px;"
        >
          💛
        </span>

        <span
          class="heart heart4"
          style="--x:-100px; --y:-40px;"
        >
          🌼
        </span>


      </div>


      <!-- MESSAGE -->

      <div
        class="message"
        id="message"
      >

        <p id="messageText">
        </p>

      </div>


      <!-- YOUR RP PHOTO -->

      <img
        src="photo4.jpg"
        id="babyPhoto"
        class="baby-photo"
        alt="Baby 🐱"
      >


      <!-- NEXT -->

      <button
        class="next-btn"
        id="nextButton"
        onclick="nextPage()"
      >
        Next → 🌼
      </button>


      <p class="bottom-text">
        Somewhere in this huge universe... 🌌<br>
        I found you. 💛
      </p>


    </div>

  </main>


  <script>


    /* =========================
       DADA PLANET
    ========================= */

    function touchDada() {

      const message =
        document.getElementById("message");

      const text =
        document.getElementById("messageText");


      text.innerHTML =
        "No matter how far apart we are... 🌌" +
        "<span class='big'>" +
        "You'll always be my Dada. 💛" +
        "</span>";


      message.style.display = "block";


      createHearts();


      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }


    /* =========================
       BABY PLANET
    ========================= */

    function touchBaby() {

      const message =
        document.getElementById("message");

      const text =
        document.getElementById("messageText");

      const photo =
        document.getElementById("babyPhoto");

      const next =
        document.getElementById("nextButton");


      text.innerHTML =
        "Meee!!! Your tiny baby is right hereee! 🐱🎀" +
        "<span class='big'>" +
        "I may be small in your universe..." +
        "<br>" +
        "but you mean the whole universe to me. 🌌💛" +
        "</span>";


      message.style.display = "block";


      /* SHOW PHOTO */

      photo.style.display = "block";


      /* SHOW NEXT BUTTON */

      next.style.display = "inline-block";


      /* FLOATING HEARTS */

      createHearts();


      /* SCROLL */

      setTimeout(function() {

        message.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }, 200);

    }


    /* =========================
       FLOATING EFFECT
    ========================= */

    function createHearts() {

      const hearts =
        document.querySelectorAll(".heart");


      hearts.forEach(function(heart) {

        heart.classList.remove("active");

        void heart.offsetWidth;

        heart.classList.add("active");

      });

    }


    /* =========================
       NEXT PAGE
    ========================= */

    function nextPage() {

      window.location.href =
        "page7.html";

    }


  </script>

</body>
  </html>
