<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Dada 💛</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Georgia", serif;
        background:
            radial-gradient(circle at 20% 20%, rgba(255, 225, 150, 0.18), transparent 25%),
            radial-gradient(circle at 80% 80%, rgba(255, 180, 210, 0.15), transparent 30%),
            linear-gradient(135deg, #120d1c, #211426, #0d1520);
        color: white;
    }

    /* Soft stars */
    .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        opacity: 0.6;
        animation: twinkle 3s infinite ease-in-out;
    }

    .star:nth-child(1) { top: 12%; left: 15%; animation-delay: .2s; }
    .star:nth-child(2) { top: 25%; left: 80%; animation-delay: 1s; }
    .star:nth-child(3) { top: 70%; left: 12%; animation-delay: 1.7s; }
    .star:nth-child(4) { top: 82%; left: 75%; animation-delay: .8s; }
    .star:nth-child(5) { top: 45%; left: 90%; animation-delay: 2s; }
    .star:nth-child(6) { top: 10%; left: 55%; animation-delay: 1.3s; }
    .star:nth-child(7) { top: 60%; left: 50%; animation-delay: .5s; }
    .star:nth-child(8) { top: 35%; left: 30%; animation-delay: 2.2s; }

    @keyframes twinkle {
        0%, 100% {
            opacity: .25;
            transform: scale(.7);
        }
        50% {
            opacity: 1;
            transform: scale(1.4);
        }
    }

    /* Floating hearts */
    .heart {
        position: fixed;
        bottom: -30px;
        font-size: 18px;
        opacity: 0;
        animation: floatUp 8s linear infinite;
        pointer-events: none;
    }

    .heart:nth-child(1) { left: 10%; animation-delay: 1s; }
    .heart:nth-child(2) { left: 30%; animation-delay: 4s; }
    .heart:nth-child(3) { left: 55%; animation-delay: 2s; }
    .heart:nth-child(4) { left: 78%; animation-delay: 5s; }
    .heart:nth-child(5) { left: 90%; animation-delay: 7s; }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(.8);
            opacity: 0;
        }

        15% {
            opacity: .7;
        }

        80% {
            opacity: .5;
        }

        100% {
            transform: translateY(-110vh) scale(1.3) rotate(20deg);
            opacity: 0;
        }
    }

    /* Main card */
    .card {
        width: min(90%, 620px);
        min-height: 500px;
        padding: 55px 35px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;

        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 30px;

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        box-shadow:
            0 20px 70px rgba(0,0,0,.45),
            inset 0 0 30px rgba(255,255,255,.03);

        animation: cardAppear 1.5s ease;
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .kitty {
        font-size: 55px;
        margin-bottom: 25px;
        animation: gentleFloat 3s ease-in-out infinite;
    }

    @keyframes gentleFloat {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    .text {
        min-height: 190px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .line {
        opacity: 0;
        transform: translateY(12px);
        transition:
            opacity 1.2s ease,
            transform 1.2s ease;
        margin: 9px 0;
        line-height: 1.7;
    }

    .line.show {
        opacity: 1;
        transform: translateY(0);
    }

    .line.first {
        font-size: 25px;
        color: #ffe8a8;
    }

    .line.second {
        font-size: 25px;
        color: #ffd6e8;
    }

    .line.third {
        margin-top: 25px;
        font-size: 22px;
        color: #fff5c7;
        font-style: italic;
    }

    .signature {
        margin-top: 20px;
        font-size: 20px;
        color: #ffd1e6;
        opacity: 0;
        transform: translateY(10px);
        transition: 1.3s ease;
    }

    .signature.show {
        opacity: 1;
        transform: translateY(0);
    }

    .secret {
        margin-top: 28px;
        font-size: 19px;
        color: #ffe6a6;
        opacity: 0;
        transform: translateY(10px);
        transition: 1.5s ease;
    }

    .secret.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* Button */
    .next-btn {
        margin-top: 30px;
        padding: 13px 28px;

        border: 1px solid rgba(255,255,255,.25);
        border-radius: 30px;

        background: rgba(255, 220, 150, .12);
        color: #fff3cf;

        font-size: 16px;
        font-family: inherit;

        cursor: pointer;

        opacity: 0;
        pointer-events: none;

        transition:
            opacity 1s ease,
            transform .3s ease,
            background .3s ease,
            box-shadow .3s ease;
    }

    .next-btn.show {
        opacity: 1;
        pointer-events: auto;
    }

    .next-btn:hover {
        transform: translateY(-3px);
        background: rgba(255, 220, 150, .22);
        box-shadow: 0 8px 25px rgba(255,210,150,.15);
    }

    .next-btn:active {
        transform: scale(.96);
    }

    /* Mobile */
    @media (max-width: 600px) {
        .card {
            min-height: 500px;
            padding: 45px 24px;
            border-radius: 25px;
        }

        .kitty {
            font-size: 48px;
        }

        .line.first,
        .line.second {
            font-size: 21px;
        }

        .line.third {
            font-size: 19px;
        }

        .signature {
            font-size: 18px;
        }

        .secret {
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

<div class="heart">💛</div>
<div class="heart">🌼</div>
<div class="heart">💗</div>
<div class="heart">✨</div>
<div class="heart">💛</div>

<div class="card">

    <div class="kitty">🐱🎀</div>

    <div class="text">

        <div class="line first" id="line1">
            “This whole little world...”
        </div>

        <div class="line second" id="line2">
            “...was made by your little baby. 🐱🎀”
        </div>

        <div class="line third" id="line3">
            “No matter where life takes us...<br>
            you'll always be my Dada,<br>
            and I'll always be your baby. 💛”
        </div>

    </div>

    <div class="signature" id="signature">
        🌼 “For my Dada, with all my heart.” 🐱💗
    </div>

    <div class="secret" id="secret">
        There’s still one last secret... 👀💛
    </div>

    <button class="next-btn" id="nextBtn" onclick="goNext()">
        Open the last secret ✨
    </button>

</div>

<script>

    /*
       The page reveals each part slowly,
       giving the emotional lines their own little moment.
    */

    setTimeout(() => {
        document.getElementById("line1").classList.add("show");
    }, 1000);

    setTimeout(() => {
        document.getElementById("line2").classList.add("show");
    }, 3000);

    setTimeout(() => {
        document.getElementById("line3").classList.add("show");
    }, 5500);

    setTimeout(() => {
        document.getElementById("signature").classList.add("show");
    }, 8500);

    setTimeout(() => {
        document.getElementById("secret").classList.add("show");
    }, 10500);

    setTimeout(() => {
        document.getElementById("nextBtn").classList.add("show");
    }, 12000);


    function goNext() {

        document.body.style.transition = "1s ease";
        document.body.style.opacity = "0";

        setTimeout(() => {
            window.location.href = "page9.html";
        }, 1000);
    }

</script>

</body>
</html>
